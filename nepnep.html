<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A date request for My pretty hair Kouhai(junior) 🍓</title>
    <style>
        :root {
            --strawberry-deep: #ff004c;
            --strawberry-soft: #ff8fa3;
            --cream-light: #fff0f5;
            --cream-dark: #ffebee;
            --gold: #f4d03f;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, var(--cream-light), var(--cream-dark));
            background-image: radial-gradient(var(--strawberry-soft) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            text-align: center;
        }

        .strawberry-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; opacity: 0.6;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 40px;
            border: 5px solid var(--gold);
            box-shadow: 0 20px 50px rgba(255, 0, 76, 0.25);
            width: 85%;
            max-width: 400px;
            z-index: 10;
            position: relative;
        }

        .anime-display {
            width: 100%;
            height: 250px; 
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            overflow: hidden;
            border-radius: 20px;
            border: 3px solid var(--strawberry-soft);
            background: white;
        }

        .anime-display img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 { color: var(--strawberry-deep); font-size: 2rem; margin-bottom: 10px; font-weight: 700;}
        p { color: #555; font-size: 1.1rem; line-height: 1.5; margin: 10px 0;}
        
        .buttons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 120px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #yesBtn { 
            background: linear-gradient(135deg, #ff4d6d, #ff004c);
            color: white; 
            box-shadow: 0 6px 20px rgba(255, 0, 76, 0.5);
            z-index: 20;
            position: relative;
            white-space: nowrap;
        }

        #noBtn { 
            background-color: #ffd1dc; 
            color: var(--strawberry-deep); 
            z-index: 15;
            position: relative; 
        }

        @media (max-width: 600px) {
            .container { padding: 40px 20px; width: 90%; }
            .anime-display { height: 300px; }
            h1 { font-size: 2.3rem; }
            p { font-size: 1.25rem; }
            button { padding: 18px 40px; font-size: 1.4rem; }
        }

        .hidden { display: none; }

        .main-img {
            width: 80px;
            margin-bottom: 10px;
            animation: float 2.5s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .success-gifs {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .success-gifs img {
            width: 100%;
            max-width: 350px;
            border-radius: 20px;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="strawberry-bg" id="bg"></div>

    <div class="container" id="mainCard">
        <div class="anime-display">
            <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3ZXFqeTd6c28zcmRiZXdxOGF2czFtcWtiMjBlNXRhbjcwbmNwZ2V6YyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/f90zcd0TyAKhq7VSrp/giphy.gif" id="mainAnime" alt="Anime">
        </div>
        
        <img src="https://img.icons8.com/emoji/96/000000/strawberry-emoji.png" class="main-img" alt="Strawberry">
        <h1>Hi, pretty Nepnep!! 🍓</h1>
        <p>baka naisip mo random nmn netooo and ask lng sana kita on a date hihi</p>
        <p>A date (syempre alang kapeee) with your Senpai(Koya)!</p>
        <p><strong>Will you go on a Date with me? hihi</strong></p>
        
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">YES! ✨🍓</button>
            <button id="noBtn" onmouseover="handleNo()" onclick="handleNo()">No</button>
        </div>
    </div>

    <div id="successMessage" class="hidden" style="z-index: 30; width: 90%; max-width: 500px;">
        <h1 style="font-size: 2.5rem; color: #ff004c; text-shadow: 1px 1px #fff;">🍓 YOWN IT'S A DATE! 🍓</h1>
        <p style="font-size: 1.2rem; color: #ff4d6d; font-weight:bold;">SET NLNG TAYO DATE AFTER EXAMS! GODBLESS YOU!</p>
        
        <div class="success-gifs">
            <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExNDNlbDR4YjR5OHczcXJqb2VnYjBrNHFycTJzZnJ6d2U2MG54aWlvZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L5f4Z5JoOKARG/giphy.gif" alt="Happy Cat">
            <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3k2YjI3ZGd3cGlyamM1b2ZvcjdoZ2N4czBsbG80MmlleHJwcmw4ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/JWGgsu82QDoEE/giphy.gif" alt="Happy Anime">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        const bg = document.getElementById('bg');
        const icons = ['🍓', '💖', '✨'];
        const mainAnime = document.getElementById('mainAnime');
        const yesBtn = document.getElementById('yesBtn');
        let yesSize = 1;
        let clickCount = 0;

        const yesPhrases = [
            "YES! ✨🍓",
            "Are you sure?? 🥺",
            "Pindutin mo na to! 👉👈",
            "Sige na Nepnep!!",
            "Wala nang No No!",
            "YES NA TALAGA TO!",
            "I'm gonna cry na sige ka..",
            "BAWAL NA MAG NO! ❤️"
        ];

        const sadAnimeLinks = [
            "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3xwcXloNmR1ajJwcnZkMnR5eDR2eWNqbzJyMm5rZXVsOXp4bjd1ciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/TwPVBXmCkCl0URWrVj/giphy.gif",
            "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExeXN3MHU5ODNsdXd2bWNmYnlubW0zeGRsNHUwZGMzNG5saGY5eHg5cCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/JoIWAn4rnQud5Xw81w/giphy.gif",
            "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExY3oybjd6MnZ6MGJ2OGpkdXlwOHBoMHY1NDloM283M2hzMDl3aDhnNyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/q1R1ZiUskINVOn6bz3/giphy.gif",
            "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExdzV2eThldXFjbnV6Y2JnOGUwY28xc3JodWM1cG43cTdiNGZjbHB1cCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/shVJpcnY5MZVK/giphy.gif",
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNWFvNWFudHh2b25zY2Q2bDFrZTlmcnFxaGhuNjg2OHJsejJ6OGV3cyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/FB5EOw0CaaQM0/giphy.gif",
            "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3cjhmdXBwd3Nrdzd3ZjNkangzOWJhMHlhMWlyMWVpNm5oZHdmaGh6NSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/KOYptxBqx90uW8Z88r/giphy.gif",
            "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3bzhwajFtNTd2bXl1cGF4N3lpanJzYTJiamM5cjVlNXVydzF1emtpaCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/SznCZeibJJiOK6QbhT/giphy.gif"
        ];

        for (let i = 0; i < 20; i++) {
            const icon = document.createElement('div');
            icon.innerText = icons[Math.floor(Math.random() * icons.length)];
            icon.style.position = 'absolute';
            icon.style.left = Math.random() * 100 + 'vw';
            icon.style.top = Math.random() * 100 + 'vh';
            icon.style.fontSize = '25px';
            bg.appendChild(icon);
        }

        function handleNo() {
            const noBtn = document.getElementById('noBtn');
            noBtn.style.position = 'fixed'; 
            const padding = 80; 
            const bx = noBtn.offsetWidth;
            const by = noBtn.offsetHeight;
            const x = Math.max(20, Math.random() * (window.innerWidth - bx - 20));
            const y = Math.max(20, Math.random() * (window.innerHeight - by - 20));
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;

            mainAnime.src = sadAnimeLinks[Math.floor(Math.random() * sadAnimeLinks.length)];
            clickCount++;
            growYes();
        }

        function growYes() {
            yesSize += 0.25; 
            yesBtn.style.transform = `scale(${yesSize})`;
            
            // Update text based on phrase list
            if (clickCount < yesPhrases.length) {
                yesBtn.innerText = yesPhrases[clickCount];
            } else {
                yesBtn.innerText = "SABING YES NA EH! 😤";
            }
        }

        function celebrate() {
            fetch("https://formspree.io/f/xdabwbvy", {
                method: "POST",
                body: JSON.stringify({ message: "Senpai! Nepnep said YES! 🍓" }),
                headers: { 'Accept': 'application/json' }
            });
            document.getElementById('mainCard').classList.add('hidden');
            document.getElementById('successMessage').classList.remove('hidden');
            document.body.style.background = "#fff0f5";
            var end = Date.now() + (5 * 1000); 
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 80, origin: { x: 0 }, colors: ['#ff004c', '#ff4d6d', '#ffffff'] });
                confetti({ particleCount: 5, angle: 120, spread: 80, origin: { x: 1 }, colors: ['#ff004c', '#ff4d6d', '#ffffff'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
